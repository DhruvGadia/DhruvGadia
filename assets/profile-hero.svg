<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t desc">
<title id="t">Dhruv Gadia — developer, AI and bioinformatics enthusiast</title>
<desc id="desc">An animated dark-blue banner with a gently rotating orbital ring, twinkling stars and a stylized DNA double helix. The text introduces Dhruv Gadia and his interests in software, AI and bioinformatics.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080f27"/><stop offset=".54" stop-color="#10254c"/><stop offset="1" stop-color="#061021"/></linearGradient>
<radialGradient id="bloom"><stop offset="0" stop-color="#1a82d4" stop-opacity=".36"/><stop offset="1" stop-color="#1a82d4" stop-opacity="0"/></radialGradient>
<linearGradient id="dna" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65e9f6"/><stop offset=".5" stop-color="#7ba5ff"/><stop offset="1" stop-color="#3dd6bb"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45e4e8"/><stop offset="1" stop-color="#3f69f6"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="260" rx="20"/></clipPath>
</defs>
<style>
@keyframes twinkle {0%,100%{opacity:.16;transform:scale(.75)}45%{opacity:.96;transform:scale(1.4)}}
@keyframes spin {to{transform:rotate(360deg)}}
@keyframes drift {0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breathe {0%,100%{opacity:.65}50%{opacity:1}}
@keyframes scan {to{stroke-dashoffset:-95}}
.star{opacity:.35;animation:twinkle 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.orbit{transform-origin:827px 130px;animation:spin 21s linear infinite}
.dna-move{animation:drift 5s ease-in-out infinite}
.glow{animation:breathe 5s ease-in-out infinite}
.trace{stroke-dasharray:7 15;animation:scan 8s linear infinite}
@media(prefers-reduced-motion:reduce){.star,.orbit,.dna-move,.glow,.trace{animation:none!important;opacity:1}}
</style>
